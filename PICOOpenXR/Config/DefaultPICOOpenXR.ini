; Copyright (c) PICO. UE 5.9 adaptation: struct renames that were shipped in the 6.1.4
; content without matching CoreRedirects entries. Without these, loading
; /PICOOpenXR/DevTools/MixedReality/BP_SceneCapturesGenerator_Sample logs
; "has a struct type mismatch (tag X != prop Y) ... add an entry to ActiveStructRedirects".
;
; Syntax reference: Engine/Config/BaseEngine.ini [CoreRedirects] section
;   ; +ClassRedirects=(OldName="OldClass", NewName="/Script/Module.NewClass")
; Plugin inis are read for [CoreRedirects] by FCoreRedirects::ReadRedirectsFromIni.
[CoreRedirects]
+StructRedirects=(OldName="SceneCaptureGeneratorActor",NewName="/Script/PICOOpenXRMR.SceneCaptureGeneratorActorPICO")
+StructRedirects=(OldName="PICOUVAdjustment",NewName="/Script/PICOOpenXRMR.UVAdjustmentPICO")
